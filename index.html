<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lembayung Jiwa - Game Interaktif Cinta & Drama</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0b0e;
      color: #e6e1e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .app-card {
      width: 100%;
      max-width: 420px;
      background: #18131a;
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 92vh;
      border: 1px solid #2d2230;
    }

    .header {
      border-bottom: 1px solid #332438;
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e0b0ff;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .mood-badge {
      align-self: flex-start;
      font-size: 0.76rem;
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: all 0.3s ease;
    }

    /* Variasi Gelombang Emosi (Mood) */
    .mood-tense {
      background-color: #3b1c20;
      color: #ff8585;
      border: 1px solid #702e38;
    }

    .mood-warm {
      background-color: #311c38;
      color: #e8a0ff;
      border: 1px solid #632b73;
    }

    .mood-love {
      background-color: #381423;
      color: #ff85b3;
      border: 1px solid #802348;
    }

    .mood-dark {
      background-color: #1a171c;
      color: #a39ca8;
      border: 1px solid #3d3542;
    }

    .mood-tragic {
      background-color: #2b0d0d;
      color: #ff4d4d;
      border: 1px solid #801a1a;
    }

    .story-body {
      flex-grow: 1;
      font-size: 0.96rem;
      line-height: 1.7;
      color: #d6cbd8;
      white-space: pre-line;
      overflow-wrap: break-word;
      word-break: break-word;
      margin-bottom: 20px;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-choice {
      background-color: #241a29;
      border: 1px solid #45304f;
      color: #f1e6f5;
      padding: 13px 15px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      line-height: 1.45;
      transition: all 0.2s ease;
      overflow-wrap: break-word;
      word-break: break-word;
      width: 100%;
    }

    .btn-choice:active {
      background-color: #532d61;
      border-color: #e0b0ff;
      color: #ffffff;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <div class="title" id="chapter-title">Bab 1: Retakan di Jam Tiga Pagi</div>
      <div id="mood-indicator" class="mood-badge mood-tense">Emosi Farhan: Tegang & Lelah</div>
    </div>
    
    <div class="story-body" id="story-text">
      <!-- Teks cerita -->
    </div>

    <div class="choices-container" id="choices-box">
      <!-- Pilihan alur -->
    </div>
  </div>

  <script>
    const storyData = {
      /* === BAB 1 === */
      start: {
        title: "Bab 1: Retakan di Jam Tiga Pagi",
        moodClass: "mood-tense",
        moodText: "Emosi Farhan: Tegang & Lelah",
        text: "Jam dinding menunjukkan pukul 03.15 pagi. Bau hujan malam masih pekat menusuk balkon apartemen. Pintu depan baru saja menghentak pelan—Farhan melangkah masuk dengan kemeja kusut dan lingkaran hitam melingkari matanya.\n\nKamu sudah menunggunya di sofa sejak semalam. Pikiran buruk, rasa cemburu, dan kecurigaan telah menggerogoti dadamu selama lima jam tanpa kabar.\n\n'Kamu baru pulang jam segini?' suaramu gemetar menahan amarah.\n\nFarhan menghela napas berat, melepas jam tangannya dan melemparnya ke meja. 'Tolong, Maya... aku baru selesai meeting darurat. Aku benar-benar lelah, jangan mulai bertengkar sekarang.'",
        choices: [
          { text: "Genggam tangannya yang dingin, turunkan egomu dan tanyakan kondisinya", nextScene: "ch1_sabar" },
          { text: "Ledakkan amarahmu, tuduh dia menyembunyikan sesuatu darimu", nextScene: "ch1_emosi" }
        ]
      },

      /* === BAB 2 (ALUR REDAK) === */
      ch1_sabar: {
        title: "Bab 2: Bisikan Kerentanan",
        moodClass: "mood-warm",
        moodText: "Emosi Farhan: Pelan-pelan Luluh",
        text: "Kamu menahan napas, meredam emosimu yang hampir meledak. Kamu melangkah mendekat dan memegang tangannya yang terasa dingin.\n\nMatanya yang tajam perlahan meredup. Bahunya yang tegang jatuh. Farhan menunduk, lalu menyandarkan dahi hangatnya di bahumu. Napasnya terengah halus.\n\n'Aku hampir gila hari ini, Maya... proyek kantor kacau, dan ketakutan terbesarku adalah kehilangan kamu jika aku gagal,' bisiknya dengan suara serak yang hampir memecah keheningan.",
        choices: [
          { text: "Peluk tubuhnya erat dan katakan kamu percaya padanya", nextScene: "ch2_jujur" },
          { text: "Tetap minta dia jujur tentang pesan asing di ponselnya minggu lalu", nextScene: "ch2_ragu" }
        ]
      },

      /* === BAB 2 (ALUR LEDAKAN) === */
      ch1_emosi: {
        title: "Bab 2: Ledakan di Tengah Malam",
        moodClass: "mood-tragic",
        moodText: "Emosi Farhan: Marah & Terluka",
        text: "'Meeting jam 3 pagi?! Kamu pikir aku bodoh, Farhan?' kamu berteriak sambil mendorong dadanya.\n\nFarhan terperanjat. Tatapan matanya berubah menjadi dingin dan menusuk. 'Cukup, Maya! Aku bekerja mati-matian untuk masa depan kita, dan setiap hari aku pulang hanya untuk diinterogasi seperti penjahat!'\n\nIa menyapu vas bunga di atas meja hingga pecah berantakan di lantai. Suara pecahan kaca menggelegar menyayat malam.",
        choices: [
          { text: "Sadar akan kekacauan ini, menangis dan Minta Maaf atas emosimu", nextScene: "ch2_jujur" },
          { text: "Berteriak menyuruhnya pergi meninggalkan apartemen detik ini juga", nextScene: "ch2_usir" }
        ]
      },

      /* === BAB 3 (KEJUJURAN & KEHANGATAN) === */
      ch2_jujur: {
        title: "Bab 3: Saling Merengkuh Luka",
        moodClass: "mood-warm",
        moodText: "Emosi Farhan: Merasa Diterima & Hangat",
        text: "Kalian berdua duduk di lantai bersandarkan sofa. Pertengkaran perlahan mencair menjadi kejujuran yang telanjang.\n\nFarhan menggenggam jemarimu erat, mengecup punggung tanganmu berulang kali. 'Maafkan aku yang terlalu tertutup... Aku cuma takut membuatmu cemas dengan masalahku.'\n\nKamu meresapi setiap detak jantungnya. Rasa cemburu yang tadinya membakar kini tergantikan oleh rasa sayang yang begitu dalam dan protektif.",
        choices: [
          { text: "Ajak dia masuk ke kamar tidur untuk beristirahat bersama", nextScene: "ch3_peluk" },
          { text: "Kembali ragu dan pertanyakan apakah dia benar-benar tulus", nextScene: "ch2_ragu" }
        ]
      },

      /* === BAB 3 (KECURIGAAN BERULANG) === */
      ch2_ragu: {
        title: "Bab 3: Benih Racun Kecurigaan",
        moodClass: "mood-tense",
        moodText: "Emosi Farhan: Kecewa & Lelah Emosi",
        text: "Farhan menarik tangannya perlahan dari genggamanmu. Ia menatapmu dengan rasa tak percaya.\n\n'Jadi setelah semua yang kujelaskan... kamu masih tidak percaya padaku, Maya?' suaranya bergetar menahan kekecewaan yang sangat dalam.\n\nIa berdiri, berjalan menjauhi sofa. Jarak di antara kalian terasa membeku kembali, lebih dingin dari udara malam di luar.",
        choices: [
          { text: "Hampiri dia, peluk punggungnya dari belakang dan mohon ampun", nextScene: "ch3_peluk" },
          { text: "Biarkan dia dingin dan tuduh dia melarikan diri dari kenyataan", nextScene: "ch3_tuduh" }
        ]
      },

      /* === BAB 3 (PENGUSIRAN / KEHANCURAN) === */
      ch2_usir: {
        title: "Bab 3: Pergi Menerobos Hujan",
        moodClass: "mood-dark",
        moodText: "Emosi Farhan: Hancur & Keputusasaan",
        text: "Farhan menatap pecahan kaca di lantai, lalu menatapmu yang diselimuti kemarahan. Tanpa mengucapkan sepatah kata pun, ia mengambil jaketnya dan melangkah keluar pintu.\n\nPintu tertutup keras. Kamu mendengar langkah kakinya menghilang di lorong. Di luar, hujan deras mengguyur kota tanpa ampun.",
        choices: [
          { text: "Lari mengejarnya turun tangga menuju hujan deras", nextScene: "ch3_pergi" },
          { text: "Kunci pintu, masuk kamar, dan biarkan pikiran gelap menguasaimu", nextScene: "ch4_histeris" }
        ]
      },

      /* === BAB 4 (MOMEN INTIM & PERDAMAIAN) === */
      ch3_peluk: {
        title: "Bab 4: Di Bawah Pendar Selimut",
        moodClass: "mood-love",
        moodText: "Emosi Farhan: Sangat Mencintai & Pasrah",
        text: "Lampu kamar sengaja diredupkan. Suara gemericik sisa hujan di luar menjadi melodi latar yang menenangkan.\n\nFarhan merebahkan tubuhnya di sampingmu. Ia menarik tubuhmu rapat ke dalam pelukannya, menyembunyikan wajahnya di ceruk lehermu. Hembusan napas hangatnya menyapu kulitmu.\n\n'Jangan pernah biarkan kita saling menyakiti lagi, Maya... aku tidak bisa hidup tanpa kamu,' bisiknya lembut penuh penyerahan cinta.",
        choices: [
          { text: "Rebahkan dirimu sepenuhnya, saling mengunci dalam pelukan dan tidur bersama", nextScene: "ending_happy" },
          { text: "Tiba-tiba melepaskan pelukannya karena kenangan pahit masa lalu mendadak muncul", nextScene: "ch3_tuduh" }
        ]
      },

      /* === BAB 4 (PUNCAK KONFRONTASI) === */
      ch3_tuduh: {
        title: "Bab 4: Ambang Keretakan Total",
        moodClass: "mood-tragic",
        moodText: "Emosi Farhan: Puncak Kemarahan & Putus Asa",
        text: "'Aku lelah, Maya! Aku benar-benar lelah!' suara Farhan menggema di seluruh ruangan. Matanya memerah basah oleh air mata frustrasi.\n\n'Apapun yang kukerjakan selalu salah di matamu! Jika kamu memang ingin aku menghilang dari hidupmu, katakan sekarang!'\n\nAtmosfer di dalam ruangan begitu sesak, seolah udara telah habis tersedot oleh emosi negatif kalian berdua.",
        choices: [
          { text: "Menangis histeris, menyalahkan dirimu sendiri dan mengancam menyakiti diri", nextScene: "ch4_histeris" },
          { text: "Terdiam, sadar dan langsung memeluk kakinya sambil memohon maaf", nextScene: "ch4_bicara" }
        ]
      },

      /* === BAB 4 (PENGEJARAN DI HUJAN) === */
      ch3_pergi: {
        title: "Bab 4: Tangisan di Bawah Hujan",
        moodClass: "mood-tragic",
        moodText: "Emosi Farhan: Terpukul & Basah Kuyup",
        text: "Kamu berlari keluar apartemen tanpa alas kaki. Di halaman bawah, kamu melihat Farhan berdiri mematung di bawah guyuran hujan deras, air mata menyatu dengan bulir hujan di pipinya.\n\nKamu berlari dan memeluk punggungnya dari belakang. Tubuhnya gemetar kedinginan dan terguncang oleh histeria tangis.\n\n'Jangan pergi... tolong jangan tinggalkan aku, Farhan!' jeritmu di antara deru hujan.",
        choices: [
          { text: "Ajak dia kembali ke atas, keringkan tubuhnya dan saling memaafkan", nextScene: "ch4_bicara" },
          { text: "Lepaskan pelukanmu dan biarkan dia pergi membawa penyesalan", nextScene: "ch4_histeris" }
        ]
      },

      /* === BAB 5 (PEMULIHAN JIWA) === */
      ch4_bicara: {
        title: "Bab 5: Pemulihan Luka Hati",
        moodClass: "mood-warm",
        moodText: "Emosi Farhan: Harapan & Penyesalan Dalam",
        text: "Kalian kembali ke dalam rumah dengan tubuh basah dan hati yang remuk, namun keputusasaan berganti menjadi kesadaran betapa dalam kalian saling membutuhkan.\n\nFarhan mengeringkan rambutmu dengan handuk, menatap matamu yang sembab dengan rasa cinta dan penyesalan yang tak terhingga.\n\n'Kita hampir menghancurkan diri kita sendiri malam ini... Mari kita perbaiki semuanya dari awal, Maya.'",
        choices: [
          { text: "Genggam tangannya, rebahkan tubuh bersama di kasur hangat", nextScene: "ending_happy" }
        ]
      },

      /* === BAB 5 (JALUR KEGELAPAN / HISTERIA) === */
      ch4_histeris: {
        title: "Bab 5: Dalam Gelap Keputusasaan",
        moodClass: "mood-dark",
        moodText: "Emosi: Kehancuran Jiwa & Paranoia",
        text: "Pikiranmu hancur total. Suara-suara negatif di kepalamu berbisik bahwa kamu adalah beban, bahwa kamu telah menghancurkan satu-satunya orang yang kamu cintai, dan tidak ada lagi jalan keluar dari penderitaan ini.\n\nRuangan terasa makin gelap, dingin, dan hampa. Kamu mengunci pintu kamar mandi dari dalam, menggenggam benda tajam dengan jemari gemetar hebat, membiarkan depresi mematikan selaras dengan detak jantungmu yang makin melambat.",
        choices: [
          { text: "Menyerah pada kegelapan dan mengakhiri semua rasa sakit ini...", nextScene: "ending_bad" }
        ]
      },

      /* === ENDINGS === */
      ending_happy: {
        title: "Akhir Cerita: Dalam Pelukan Hangat (Happy Ending)",
        moodClass: "mood-love",
        moodText: "Status: Tidur Bersama Dalam Kedamaian Cinta",
        text: "Di atas tempat tidur yang hangat, seluruh badai emosi malam ini akhirnya mereda.\n\nKamu berbaring di atas dada bidang Farhan, mendengarkan detak jantungnya yang teratur. Tangan kekarnya mengelus punggung dan rambutmu dengan kelembutan yang menyembuhkan setiap retakan luka.\n\n'Selamat tidur, cintaku... esok adalah hari yang baru untuk kita,' bisik Farhan lembut di keningmu.\n\nKalian berdua perlahan terlelap dalam tidur yang lelap, saling mengunci dalam pelukan hangat hingga fajar menyingsing.",
        choices: [
          { text: "Mainkan Ulang Cerita", nextScene: "start" }
        ]
      },

      ending_bad: {
        title: "Akhir Cerita: Tragedi Keputusasaan (Bad Ending)",
        moodClass: "mood-tragic",
        moodText: "Status: Akhir Tragis & Penyesalan Abadi",
        text: "Keesokan harinya, pintu kamar mandi didobrak paksa.\n\nFarhan terduduk histeris di lantai yang dingin, menjerit histeris sambil memeluk tubuhmu yang sudah kaku dan pucat tak bernyawa. Penyesalan mendalam menyiksa jiwanya seumur hidup.\n\nSebuah keputusan impulsif di tengah badai emosi telah memadamkan takdir cinta kalian selamanya dalam tragedi keputusasaan yang tak terobati.",
        choices: [
          { text: "Mainkan Ulang Cerita", nextScene: "start" }
        ]
      }
    };

    function renderScene(sceneId) {
      const scene = storyData[sceneId];
      if (!scene) return;

      document.getElementById('chapter-title').innerText = scene.title;
      document.getElementById('story-text').innerText = scene.text;

      // Update Indikator Emosi
      const moodIndicator = document.getElementById('mood-indicator');
      moodIndicator.innerText = scene.moodText;
      moodIndicator.className = 'mood-badge ' + scene.moodClass;

      // Render Pilihan
      const choicesBox = document.getElementById('choices-box');
      choicesBox.innerHTML = '';

      scene.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-choice';
        btn.innerText = choice.text;
        btn.onclick = () => renderScene(choice.nextScene);
        choicesBox.appendChild(btn);
      });

      window.scrollTo(0, 0);
    }

    renderScene('start');
  </script>
</body>
</html>
