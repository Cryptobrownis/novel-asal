<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Malam di Balik Tirai Velvet - Novel Interaktif Dewasa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0b0709;
      color: #eae1e3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-card {
      width: 100%;
      max-width: 420px;
      background: #180f13;
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 10px 30px rgba(217, 56, 86, 0.15);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 90vh;
      border: 1px solid #361720;
    }

    .header {
      border-bottom: 1px solid #3a1c25;
      padding-bottom: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .title {
      font-size: 1rem;
      font-weight: 700;
      color: #e58b9e;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .mood-badge {
      align-self: flex-start;
      font-size: 0.78rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-block;
    }

    .mood-neutral {
      background-color: #2a2025;
      color: #d1c2a5;
      border: 1px solid #4a3842;
    }

    .mood-positive {
      background-color: #3b111a;
      color: #ff85a1;
      border: 1px solid #701c30;
    }

    .mood-negative {
      background-color: #1a1721;
      color: #a0a5b5;
      border: 1px solid #383c4d;
    }

    .story-body {
      flex-grow: 1;
      font-size: 0.98rem;
      line-height: 1.75;
      color: #dcd0d4;
      white-space: pre-line;
      overflow-wrap: break-word;
      word-break: break-word;
      margin-bottom: 20px;
    }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-choice {
      background-color: #24141a;
      border: 1px solid #4d2330;
      color: #f3e6e8;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      line-height: 1.45;
      transition: all 0.2s ease;
      overflow-wrap: break-word;
      word-break: break-word;
      width: 100%;
    }

    .btn-choice:active {
      background-color: #5c182a;
      border-color: #e58b9e;
      color: #ffffff;
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <div class="title" id="chapter-title">Bab 1: Kepulangan di Tengah Malam</div>
      <div id="mood-indicator" class="mood-badge mood-neutral">Status Reza: Menanti</div>
    </div>
    
    <div class="story-body" id="story-text">
      <!-- Teks cerita -->
    </div>

    <div class="choices-container" id="choices-box">
      <!-- Pilihan alur -->
    </div>
  </div>

  <script>
    const storyData = {
      start: {
        title: "Bab 1: Kepulangan di Tengah Malam",
        mood: "neutral",
        moodText: "Status Reza: Menanti responmu",
        text: "Hujan gerimis membasahi kaca penthouse tempat kalian tinggal bersama. Lampu kamar sengaja kamu redupkan, hanya menyisakan pendar hangat dari lampu tidur.\n\nPintu suite terbuka pelan. Reza—kekasihmu—melangkah masuk. Pria bertubuh jangkung dengan dada bidang itu melepas dasi dan dua kancing teratas kemejanya. Tatapan matanya tajam, sarat akan gairah dan kerinduan setelah tiga minggu bertugas di luar negeri.\n\nIa mendekatimu yang sedang bersandar di tepi tempat tidur berbalut lingerie sutra tipis. Nafasnya hangat saat menunduk menyapu ceruk lehermu.\n\n'Aku merindukanmu sampai rasanya mau gila,' bisiknya rendah dan serak, menyatukan jemarinya di pinggangmu.",
        choices: [
          { text: "Rengkuh lehernya, tarik dia mendekat dan bisikkan godaan mesra", nextScene: "sambutMesra" },
          { text: "Dorong dadanya pelan lalu minta dia mandi dulu karena badannya terasa dingin", nextScene: "tolakDingin" }
        ]
      },

      /* --- ALUR POSITIF 1 --- */
      sambutMesra: {
        title: "Bab 2: Bisikan Gairah",
        mood: "positive",
        moodText: "Status Reza: Sangat Berhasrat & Bahagia",
        text: "Mata Reza menggelap seketika, berbinar penuh kepuasan. Bisikan gairahmu membakar habis sisa kelelahan dari perjalanan jauhnya.\n\nTanpa membuang waktu, tangan kekarnya merengkuh pinggangmu lebih erat, menarik tubuhmu rapat menempel pada dadanya yang keras. Bibirnya menyapu bibirmu dengan ciuman yang dalam, penuh penekanan dan rasa lapar yang tak tertahankan.\n\nJemarinya perlahan menyusup ke balik sutra tipis di punggungmu, mengirimkan sengatan panas ke seluruh sarafmu.\n\n'Kamu tahu persis cara membuatku bertekuk lutut, sayang,' bisiknya di antara hembusan nafasnya yang memburu.",
        choices: [
          { text: "Lilitkan kakimu di pinggangnya dan biarkan dia membawamu ke atas tempat tidur", nextScene: "puncakGairah" },
          { text: "Hentikan ciumannya sebentar dan tanyakan apakah dia membawakan hadiah untukmu", nextScene: "gangguMomen" }
        ]
      },

      /* --- ALUR NEGATIF 1 --- */
      tolakDingin: {
        title: "Bab 2: Pembekuan Suasana",
        mood: "negative",
        moodText: "Status Reza: Kecewa & Terluka",
        text: "Reza terdiam kaku. Gerakan tangannya di pinggangmu terhenti seketika.\n\nIa menarik tubuhnya mundur setengah langkah. Matanya yang tadinya membara penuh rasa rindu kini meredup, menyisakan tatapan dingin dan kekecewaan yang dalam. Keheningan yang canggung memenuhi kamar tidur.\n\nIa menghela napas panjang, lalu tersenyum tipis yang terasa pahit. 'Maaf. Aku lupa kalau kamu tidak suka diganggu saat baru pulang,' katanya singkat dengan suara datar. Ia berbalik mengambil handuk dan melangkah menuju kamar mandi tanpa menatapmu lagi.",
        choices: [
          { text: "Susul dia ke kamar mandi, peluk dari belakang dan minta maaf dengan manja", nextScene: "mintaMaafGoda" },
          { text: "Biarkan saja dia pergi, lalu merebahkan diri dan mainkan ponselmu", nextScene: "cuekMendalam" }
        ]
      },

      /* --- ALUR POSITIF 2 (PUNCAK) --- */
      puncakGairah: {
        title: "Bab 3: Gelombang Hangat",
        mood: "positive",
        moodText: "Status Reza: Makin Sayang & Penuh Cinta",
        text: "Dinding kamar menjadi saksi bisu betapa membara malam kalian. Sentuhan demi sentuhan, bisikan lembut yang berganti menjadi desahan tertahan, menyatu dalam irama gairah yang dewasa dan intens.\n\nReza menatap langsung ke dalam matamu saat memanjakanmu, memastikan setiap sentuhannya membawamu ke puncak kenikmatan. Keringat tipis melapisi kulit kalian berdua.\n\nSaat semua gelombang gairah reda, Reza memelukmu erat dalam dekapan dadanya, mengelus rambutmu lembut dan mengecup keningmu berulang kali.\n\n'Aku tidak pernah menginginkan wanita lain seumur hidupku selain kamu,' bisiknya tulus.",
        choices: [
          { text: "Bisikkan bahwa kamu ingin menghabiskan sisa hidupmu bersamanya", nextScene: "happyEnding" },
          { text: "Tertawa pelan lalu menyuruhnya tidur karena esok hari sudah pagi", nextScene: "endingBiasa" }
        ]
      },

      /* --- ALUR NEGATIF KE POSITIF (RECOVERY) --- */
      mintaMaafGoda: {
        title: "Bab 3: Pencairan Es",
        mood: "positive",
        moodText: "Status Reza: Luluh & Terbakar Kembali",
        text: "Kamu melangkah masuk ke dalam kamar mandi di bawah gemericik shower hangat. Kamu memeluk tubuh Reza dari belakang, menyandarkan pipimu pada punggungnya yang basah.\n\n'Maafkan aku... aku cuma ingin kamu segar dulu, tapi aku salah,' bisikmu lembut sambil menggerakkan jemarimu di dadanya.\n\nTubuh Reza yang tadinya tegang perlahan rileks. Ia memutar tubuhnya, menatap matamu yang penuh penyesalan. Senyum hangatnya kembali terpancar.\n\n'Jangan pernah menolakku seperti itu lagi,' bisiknya serak sebelum mengangkat tubuhmu di bawah guyuran air hangat.",
        choices: [
          { text: "Pasrahkan dirimu dalam buaian mesranya", nextScene: "puncakGairah" }
        ]
      },

      /* --- ALUR GANGGU MOMEN (SENSITIF) --- */
      gangguMomen: {
        title: "Bab 3: Kehilangan Selera",
        mood: "negative",
        moodText: "Status Reza: Marah & Tersinggung",
        text: "Reza mendadak melepaskan cengkeramannya dari bahumu. Tatapannya berubah tajam dan tersinggung.\n\n'Jadi yang ada di pikiranmu saat aku merindukanmu setengah mati cuma oleh-oleh?' suaranya memotong keheningan malam.\n\nIa melangkah menjauh menuju meja kerja, melempar dompet dan jam tangannya kasar. 'Aku terbang belasan jam bukan untuk dijadikan mesin hadiah,.'",
        choices: [
          { text: "Berdiri, hampiri dia dan berikan ciuman panas tanpa banyak bicara", nextScene: "mintaMaafGoda" },
          { text: "Bela diri dan balik memarahinya karena terlalu sensitif", nextScene: "bertengkarHebat" }
        ]
      },

      /* --- ALUR CUEK (SANGAT NEGATIF) --- */
      cuekMendalam: {
        title: "Bab 3: Keheningan Pahit",
        mood: "negative",
        moodText: "Status Reza: Diam & Dingin",
        text: "Setengah jam berlalu. Reza keluar dari kamar mandi dengan pakaian santai. Ia tidak mengucapkan sepatah kata pun.\n\nIa berjalan ke sisi tempat tidur yang lain, memunggungi tubuhmu, lalu mematikan lampu kamar total. Tidak ada pelukan hangat, tidak ada kecupan selamat malam seperti biasanya.\n\nHanya ada jarak tak kasat mata yang lebar dan dingin di antara kalian berdua.",
        choices: [
          { text: "Geser tubuhmu mendekatinya, memeluk punggungnya erat dari belakang", nextScene: "mintaMaafGoda" },
          { text: "Tetap membelakanginya dan memilih tidur dengan perasaan kesal", nextScene: "badEnding" }
        ]
      },

      /* --- ENDINGS --- */
      happyEnding: {
        title: "Akhir Cerita: Jiwa yang Menyatu",
        mood: "positive",
        moodText: "Status Reza: Sangat Mencintaimu Selamanya",
        text: "Reza tersenyum tampan, menatapmu dengan binar mata paling hangat yang pernah kamu lihat. Ia mengecup bibirmu lembut.\n\nMalam ini bukan hanya tentang kehangatan fisik yang membara, tetapi tentang dua hati dewasa yang saling mengerti, saling memuaskan, dan saling mengikat janji cinta tanpa ragu.",
        choices: [
          { text: "Mainkan Ulang Novel", nextScene: "start" }
        ]
      },

      endingBiasa: {
        title: "Akhir Cerita: Malam yang Hangat",
        mood: "neutral",
        moodText: "Status Reza: Puas & Nyaman",
        text: "Reza terkekeih pelan, lalu menarik selimut menutupi tubuh kalian berdua. Ia memelukmu erat dari samping, membiarkan detak jantungnya menjadi nada pengantar tidurmu malam ini.",
        choices: [
          { text: "Mainkan Ulang Novel", nextScene: "start" }
        ]
      },

      bertengkarHebat: {
        title: "Akhir Cerita: Luka Ego",
        mood: "negative",
        moodText: "Status Reza: Marah Besar",
        text: "Pertengkaran meledak di tengah malam. Ego dan emosi membuat malam yang seharusnya penuh kehangatan berubah menjadi medan pertempuran ucapan pedas.\n\nReza mengambil kunci mobilnya dan keluar dari penthouse, membiarkanmu sendirian dalam penyesalan.",
        choices: [
          { text: "Coba Lagi dari Awal", nextScene: "start" }
        ]
      },

      badEnding: {
        title: "Akhir Cerita: Hubungan yang Hambar",
        mood: "negative",
        moodText: "Status Reza: Tembok Pertahanan Keras",
        text: "Keheningan malam itu membeku hingga pagi datang. Respon dinginmu yang berulang membuat gairah dan rasa cinta Reza perlahan terkikis, menyisakan hubungan yang hambar dan penuh jarak.",
        choices: [
          { text: "Coba Lagi dari Awal", nextScene: "start" }
        ]
      }
    };

    function renderScene(sceneId) {
      const scene = storyData[sceneId];
      if (!scene) return;

      document.getElementById('chapter-title').innerText = scene.title;
      document.getElementById('story-text').innerText = scene.text;

      // Update Indikator Emosi
      const moodIndicator = document.getElementById('mood-indicator');
      moodIndicator.innerText = scene.moodText;
      moodIndicator.className = 'mood-badge ' + (
        scene.mood === 'positive' ? 'mood-positive' :
        scene.mood === 'negative' ? 'mood-negative' : 'mood-neutral'
      );

      // Render Pilihan
      const choicesBox = document.getElementById('choices-box');
      choicesBox.innerHTML = '';

      scene.choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'btn-choice';
        btn.innerText = choice.text;
        btn.onclick = () => renderScene(choice.nextScene);
        choicesBox.appendChild(btn);
      });

      window.scrollTo(0, 0);
    }

    renderScene('start');
  </script>
</body>
</html>
